[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=reports/coverage
logging-level=INFO

[coverage:report]
show_missing = True
fail_under = 80
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:

[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist,reports,.venv,venv,instance
per-file-ignores =
    */__init__.py: F401, E402
count = True
statistics = True

[pylint]
max-line-length = 120
disable = C0114,C0115,C0116,R0903,W0511,W0212,E1101
